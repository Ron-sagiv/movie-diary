<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie diary</title>
    <script src="
https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4
"></script>
    <style type="text/tailwindcss"></style>
  </head>
  <body>
    <header>
      <nav>
        <h1>Movie Diary</h1>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Favorites</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- <section><h1>Search bar</h1>
      </section> -->
      <section id="search-form" class="bg-black w-full flex items-center justify-center">
        <div class="flex flex-col gap-4 items-center justify-center bg-slate-200/70 w-3/4 m-5 p-4 rounded-xl">
          <h2> Search for a Movie Title </h2>
          <div class="">
          <form class="" >
            <input 
            id="search-field"
            type="text"
            placeholder="movie title..."
            class="bg-gray-700/50 border-none rounded-lg p-2 w-full"
            >
            <div class="mt-4">
            <button type="submit" class="bg-[#e8a23a] rounded-lg font-semibold w-full p-2 hover:bg-white hover:cursor-pointer">
              Search
            </button>
            </div>
          </form>
          </div>
        </div>
      </section>

      <!-- movie cards layout -->
    </main>
    <footer></footer>
    <script src="./src/index.js"></script>
  </body>
</html>
